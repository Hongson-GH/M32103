                                <i class="fa-solid fa-pen-clip mr-1"></i>วัดความรู้ความเข้าใจ
                            </span>
                            <h2 class="text-xl sm:text-2xl font-bold text-slate-900">แบบทดสอบเช็กความเข้าใจประจำบทเรียนที่ ${data.num}</h2>
                        </div>
                        <div class="flex items-center gap-3">
                            <div class="bg-indigo-50 border border-indigo-200 px-3 py-1.5 rounded-xl text-xs font-semibold text-indigo-700">
                                ข้อที่ <span id="quiz-current-num">1</span> / <span id="quiz-total-num">${data.quizzes.length}</span>
                            </div>
                            <div class="bg-emerald-600 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold shadow-sm">
                                คะแนน: <span id="quiz-score">0</span>
                            </div>
                        </div>
                    </div>

                    <!-- Quiz Active Card -->
                    <div id="quiz-card" class="bg-white p-5 sm:p-7 rounded-2xl border border-slate-200 space-y-6">
                        <div class="space-y-2">
                            <h3 class="text-base sm:text-lg font-bold text-slate-800 leading-relaxed" id="quiz-question-text">--</h3>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="quiz-options-container"></div>

                        <div id="quiz-feedback-box" class="hidden p-4 rounded-xl text-sm font-medium transition-all"></div>

                        <div id="quiz-explanation-box" class="hidden bg-indigo-50/70 border border-indigo-100 p-4 rounded-xl space-y-2">
                            <h4 class="font-bold text-indigo-900 text-sm flex items-center gap-1.5">
                                <i class="fa-solid fa-graduation-cap text-indigo-600"></i> เฉลยละเอียดและวิธีคิด:
                            </h4>
                            <div id="quiz-explanation-text" class="text-slate-700 text-xs sm:text-sm leading-relaxed"></div>
                        </div>

                        <div class="flex justify-between items-center pt-4 border-t border-slate-100">
                            <button onclick="quizPrevQuestion()" id="btn-quiz-prev" class="px-4 py-2 border border-slate-200 hover:bg-slate-100 text-slate-600 text-xs sm:text-sm rounded-xl font-medium transition flex items-center gap-2 disabled:opacity-40">
                                <i class="fa-solid fa-arrow-left"></i> ข้อก่อนหน้า
                            </button>
                            <button onclick="quizNextQuestion()" id="btn-quiz-next" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm rounded-xl font-semibold shadow-sm transition flex items-center gap-2">
                                ข้อถัดไป <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                </section>

                <!-- LESSON SUMMARY & NEXT LESSON NAVIGATION -->
                <section class="bg-gradient-to-br from-indigo-900 to-slate-900 text-white rounded-2xl p-6 sm:p-8 shadow-xl space-y-4 fade-in">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div class="space-y-2 max-w-2xl">
                            <span class="bg-indigo-500/30 text-indigo-200 text-xs font-bold px-3 py-1 rounded-full border border-indigo-400/30">
                                <i class="fa-solid fa-flag-checkered mr-1"></i>สรุปบทเรียนที่ ${data.num}
                            </span>
                            <h3 class="text-xl sm:text-2xl font-bold">ยอดเยี่ยม! คุณได้เรียนรู้บทที่ ${data.num} เรียบร้อยแล้ว</h3>
                            <p class="text-indigo-200 text-xs sm:text-sm leading-relaxed">
                                ก้าวสู่บทถัดไปเพื่อต่อยอดทักษะตรีโกณมิติให้แข็งแกร่งยิ่งขึ้น
                            </p>
                        </div>
                        ${index < lessonsData.length - 1 ? `
                            <button onclick="loadLesson(${index + 1})" class="btn-interactive bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-6 py-3 rounded-xl text-sm transition shrink-0 flex items-center gap-2 shadow-lg">
                                <span>ไปบทเรียนถัดไป (บทที่ ${index + 2})</span>
                                <i class="fa-solid fa-circle-arrow-right"></i>
                            </button>
                        ` : `
                            <button onclick="toggleCurriculumModal()" class="btn-interactive bg-amber-400 hover:bg-amber-500 text-slate-950 font-bold px-6 py-3 rounded-xl text-sm transition shrink-0 flex items-center gap-2 shadow-lg">
                                <span>🎉 สำเร็จหลักสูตร 20 บทเรียน!</span>
                            </button>
                        `}
                    </div>
                </section>
            `;

            // Initialize Controls & MathJax
            renderQuickAngles();
            initCanvas();
            updateAngleDisplays(0);
            renderQuizQuestion(0);
            renderCurriculumList();

            // Scroll to top smooth
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // Typeset MathJax
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise();
            }
        }

        // NAVIGATION HELPERS
        function navigateLesson(delta) {
            const nextIdx = currentLessonIndex + delta;
            if (nextIdx >= 0 && nextIdx < lessonsData.length) {
                loadLesson(nextIdx);
            }
        }

        function toggleCurriculumModal() {
            const modal = document.getElementById('curriculumModal');
            modal.classList.toggle('hidden');
        }

        function renderCurriculumList() {
            const container = document.getElementById('curriculum-list-container');
            if (!container) return;
            container.innerHTML = '';

            lessonsData.forEach((item, idx) => {
                const isActive = (idx === currentLessonIndex);
                const row = document.createElement('div');
                row.className = `p-3.5 rounded-xl border flex items-center justify-between text-xs sm:text-sm cursor-pointer transition ${
                    isActive 
                    ? 'bg-indigo-50 border-indigo-300 text-indigo-950 font-bold shadow-xs' 
                    : 'bg-white hover:bg-slate-50 border-slate-100 text-slate-700'
                }`;

                row.onclick = () => {
                    loadLesson(idx);
                    toggleCurriculumModal();
                };

                row.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="w-7 h-7 rounded-lg ${isActive ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-500'} flex items-center justify-center font-bold text-xs">
                            ${item.num}
                        </span>
                        <span>บทที่ ${item.num}: ${item.title}</span>
                    </div>
                    ${isActive ? '<span class="text-xs bg-indigo-600 text-white px-2.5 py-0.5 rounded-full">กำลังเรียน</span>' : '<i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>'}
                `;
                container.appendChild(row);
            });
        }

        // CANVAS & INTERACTIVE TOOL ENGINE
        function renderQuickAngles() {
            const container = document.getElementById('quick-angles');
            if (!container) return;
            container.innerHTML = '';
            standardAngles.forEach(deg => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `text-xs px-2.5 py-1 rounded-md font-mono transition border ${
                    deg === canvasAngleDeg 
                    ? 'bg-indigo-600 text-white border-indigo-600 font-bold' 
                    : 'bg-white hover:bg-indigo-50 text-slate-700 border-slate-200'
                }`;
                btn.innerText = `${deg}°`;
                btn.onclick = () => setAngle(deg);
                container.appendChild(btn);
            });
        }

        function setAngle(deg) {
            if (isAnimatingCanvas) stopAnimation();
            canvasAngleDeg = (deg % 360 + 360) % 360;
            const slider = document.getElementById('angleSlider');
            if (slider) slider.value = canvasAngleDeg;
            updateAngleDisplays(canvasAngleDeg);
            renderQuickAngles();
            drawCanvas();
        }

        function onSliderAngleChange(val) {
            if (isAnimatingCanvas) stopAnimation();
            canvasAngleDeg = parseFloat(val);
            updateAngleDisplays(canvasAngleDeg);
            renderQuickAngles();
            drawCanvas();
        }

        function updateAngleDisplays(deg) {
            const rad = (deg * Math.PI) / 180;
            const cosVal = Math.cos(rad);
            const sinVal = Math.sin(rad);

            const degDisp = document.getElementById('display-degree');
            if (degDisp) degDisp.innerText = `${Math.round(deg)}°`;
            
            const radDisp = document.getElementById('display-radian');
            if (radDisp) radDisp.innerText = `${rad.toFixed(3)} rad (${(deg/180).toFixed(2)}π)`;

            const cosDisp = document.getElementById('display-cos');
            if (cosDisp) cosDisp.innerText = cosVal.toFixed(4);

            const sinDisp = document.getElementById('display-sin');
            if (sinDisp) sinDisp.innerText = sinVal.toFixed(4);

            let quadText = "แกนสมมาตร";
            if (deg > 0 && deg < 90) quadText = "Quadrant I (+, +)";
            else if (deg === 90) quadText = "แกน Y ด้านบน";
            else if (deg > 90 && deg < 180) quadText = "Quadrant II (-, +)";
            else if (deg === 180) quadText = "แกน X ด้านซ้าย";
            else if (deg > 180 && deg < 270) quadText = "Quadrant III (-, -)";
            else if (deg === 270) quadText = "แกน Y ด้านล่าง";
            else if (deg > 270 && deg < 360) quadText = "Quadrant IV (+, -)";
            else if (deg === 0 || deg === 360) quadText = "แกน X ด้านขวา";
            
            const quadDisp = document.getElementById('display-quadrant');
            if (quadDisp) quadDisp.innerText = quadText;

            const latexBox = document.getElementById('display-latex-coords');
            if (latexBox) {
                latexBox.innerHTML = `$$\\left(${cosVal.toFixed(3)},\\, ${sinVal.toFixed(3)}\\right)$$`;
                if (window.MathJax && window.MathJax.typesetPromise) {
                    window.MathJax.typesetPromise([latexBox]);
                }
            }
        }

        function initCanvas() {
            const canvas = document.getElementById('unitCircleCanvas');
            if (!canvas) return;
            const container = canvas.parentElement;

            function resize() {
                canvas.width = container.clientWidth * window.devicePixelRatio;
                canvas.height = container.clientHeight * window.devicePixelRatio;
                drawCanvas();
            }

            window.addEventListener('resize', resize);
            resize();

            function handlePointerEvent(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                const x = clientX - rect.left;
                const y = clientY - rect.top;

                const cx = rect.width / 2;
                const cy = rect.height / 2;

                const dx = x - cx;
                const dy = y - cy;

                let angleRad = Math.atan2(-dy, dx);
                if (angleRad < 0) angleRad += 2 * Math.PI;

                let angleDeg = (angleRad * 180) / Math.PI;
                setAngle(Math.round(angleDeg));
            }

            canvas.addEventListener('mousedown', (e) => { isDraggingCanvas = true; handlePointerEvent(e); });
            window.addEventListener('mousemove', (e) => { if (isDraggingCanvas) handlePointerEvent(e); });
            window.addEventListener('mouseup', () => { isDraggingCanvas = false; });

            canvas.addEventListener('touchstart', (e) => { isDraggingCanvas = true; handlePointerEvent(e); }, { passive: true });
            window.addEventListener('touchmove', (e) => { if (isDraggingCanvas) handlePointerEvent(e); }, { passive: true });
            window.addEventListener('touchend', () => { isDraggingCanvas = false; });
        }

        function drawCanvas() {
            const canvas = document.getElementById('unitCircleCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;

            const w = canvas.width;
            const h = canvas.height;

            ctx.clearRect(0, 0, w, h);

            const cx = w / 2;
            const cy = h / 2;
            const radius = Math.min(w, h) * 0.35;

            // X & Y Axes
            ctx.lineWidth = 1.5 * dpr;
            ctx.strokeStyle = '#cbd5e1';
            
            ctx.beginPath();
            ctx.moveTo(20 * dpr, cy);
            ctx.lineTo(w - 20 * dpr, cy);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(cx, 20 * dpr);
            ctx.lineTo(cx, h - 20 * dpr);
            ctx.stroke();

            // Unit Circle Arc
            ctx.lineWidth = 2.5 * dpr;
            ctx.strokeStyle = '#4338ca';
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
            ctx.stroke();

            // Radians
            const rad = (canvasAngleDeg * Math.PI) / 180;
            const px = cx + radius * Math.cos(rad);
            const py = cy - radius * Math.sin(rad);

            // Sector Fill
            ctx.fillStyle = 'rgba(99, 102, 241, 0.12)';
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, radius * 0.3, 0, -rad, true);
            ctx.closePath();
            ctx.fill();

            // Cos Line (Blue)
            ctx.lineWidth = 3 * dpr;
            ctx.strokeStyle = '#3b82f6';
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(px, cy);
            ctx.stroke();

            // Sin Line (Emerald)
            ctx.lineWidth = 3 * dpr;
            ctx.strokeStyle = '#10b981';
            ctx.beginPath();
            ctx.moveTo(px, cy);
            ctx.lineTo(px, py);
            ctx.stroke();

            // Radius Hypotenuse (Amber)
            ctx.lineWidth = 2.5 * dpr;
            ctx.strokeStyle = '#f59e0b';
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(px, py);
            ctx.stroke();

            // Point P
            ctx.fillStyle = '#6366f1';
            ctx.beginPath();
            ctx.arc(px, py, 7 * dpr, 0, 2 * Math.PI);
            ctx.fill();
            ctx.lineWidth = 2 * dpr;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();
        }

        function toggleCircleAnimation() {
            if (isAnimatingCanvas) {
                stopAnimation();
            } else {
                startAnimation();
            }
        }

        function startAnimation() {
            isAnimatingCanvas = true;
            const icon = document.getElementById('icon-animate');
            const label = document.getElementById('label-animate');
            const btn = document.getElementById('btn-animate-circle');
            if (icon) icon.className = 'fa-solid fa-pause';
            if (label) label.innerText = 'หยุดหมุน';
            if (btn) btn.className = 'bg-amber-600 hover:bg-amber-700 text-white text-xs sm:text-sm px-3.5 py-2 rounded-lg transition flex items-center gap-1.5 shadow-sm';

            function step() {
                if (!isAnimatingCanvas) return;
                canvasAngleDeg = (canvasAngleDeg + 0.8) % 360;
                const slider = document.getElementById('angleSlider');
                if (slider) slider.value = canvasAngleDeg;
                updateAngleDisplays(canvasAngleDeg);
                drawCanvas();
                animationFrameId = requestAnimationFrame(step);
            }
            animationFrameId = requestAnimationFrame(step);
        }

        function stopAnimation() {
            isAnimatingCanvas = false;
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            const icon = document.getElementById('icon-animate');
            const label = document.getElementById('label-animate');
            const btn = document.getElementById('btn-animate-circle');
            if (icon) icon.className = 'fa-solid fa-play';
            if (label) label.innerText = 'หมุนอัตโนมัติ';
            if (btn) btn.className = 'bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm px-3.5 py-2 rounded-lg transition flex items-center gap-1.5 shadow-sm';
            renderQuickAngles();
        }

        function resetUnitCircle() {
            setAngle(0);
        }

        // QUIZ ENGINE
        function renderQuizQuestion(qIdx) {
            const currentLesson = lessonsData[currentLessonIndex];
            const qList = currentLesson.quizzes;
            if (!qList || qList.length === 0) return;

            activeQuizIndex = qIdx;
            const q = qList[qIdx];

            document.getElementById('quiz-current-num').innerText = qIdx + 1;
            document.getElementById('quiz-total-num').innerText = qList.length;
            document.getElementById('quiz-question-text').innerHTML = q.question;

            const optionsContainer = document.getElementById('quiz-options-container');
            optionsContainer.innerHTML = '';

            const userSelected = userQuizAnswers[qIdx];

            q.options.forEach((optText, optIdx) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                
                let btnStyle = "bg-slate-50 hover:bg-indigo-50/60 border-slate-200 text-slate-800";
                
                if (userSelected !== undefined) {
                    if (optIdx === q.correct) {
                        btnStyle = "bg-emerald-100 border-emerald-400 text-emerald-900 font-bold";
                    } else if (userSelected === optIdx) {
                        btnStyle = "bg-rose-100 border-rose-300 text-rose-900";
                    } else {
                        btnStyle = "bg-slate-50 opacity-60 border-slate-200 text-slate-500";
                    }
                }

                btn.className = `p-3.5 rounded-xl border text-left text-xs sm:text-sm transition flex items-center gap-3 ${btnStyle}`;
                btn.innerHTML = `
                    <span class="w-6 h-6 rounded-full border border-slate-300 flex items-center justify-center text-xs font-bold shrink-0 bg-white">
                        ${String.fromCharCode(65 + optIdx)}
                    </span>
                    <span>${optText}</span>
                `;

                btn.onclick = () => selectQuizOption(qIdx, optIdx);
                optionsContainer.appendChild(btn);
            });

            const feedbackBox = document.getElementById('quiz-feedback-box');
            const expBox = document.getElementById('quiz-explanation-box');
            const expText = document.getElementById('quiz-explanation-text');

            if (userSelected !== undefined) {
                const isCorrect = (userSelected === q.correct);
                feedbackBox.className = `p-4 rounded-xl text-xs sm:text-sm font-medium border ${
                    isCorrect ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-rose-50 border-rose-200 text-rose-800'
                } block`;
                feedbackBox.innerHTML = isCorrect 
                    ? `<i class="fa-solid fa-circle-check text-emerald-600 mr-1.5"></i><b>ถูกต้อง!</b> ได้รับ +10 คะแนน`
                    : `<i class="fa-solid fa-circle-xmark text-rose-600 mr-1.5"></i><b>ยังไม่ถูกต้อง!</b> ลองศึกษาคำอธิบายด้านล่าง`;

                expText.innerHTML = q.explanation;
                expBox.classList.remove('hidden');
            } else {
                feedbackBox.className = 'hidden';
                expBox.classList.add('hidden');
            }

            document.getElementById('btn-quiz-prev').disabled = (qIdx === 0);
            document.getElementById('btn-quiz-next').innerText = (qIdx === qList.length - 1) ? 'เสร็จสิ้นแบบทดสอบ' : 'ข้อถัดไป';

            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([document.getElementById('quiz-card')]);
            }
        }

        function selectQuizOption(qIdx, optIdx) {
            if (userQuizAnswers[qIdx] !== undefined) return;

            userQuizAnswers[qIdx] = optIdx;
            const currentLesson = lessonsData[currentLessonIndex];
            if (optIdx === currentLesson.quizzes[qIdx].correct) {
                activeQuizScore += 10;
                document.getElementById('quiz-score').innerText = activeQuizScore;
            }

            renderQuizQuestion(qIdx);
        }

        function quizPrevQuestion() {
            if (activeQuizIndex > 0) {
                renderQuizQuestion(activeQuizIndex - 1);
            }
        }

        function quizNextQuestion() {
            const currentLesson = lessonsData[currentLessonIndex];
            if (activeQuizIndex < currentLesson.quizzes.length - 1) {
                renderQuizQuestion(activeQuizIndex + 1);
            } else {
                const feedbackBox = document.getElementById('quiz-feedback-box');
                feedbackBox.className = "p-5 rounded-2xl bg-indigo-900 text-white font-medium block text-center space-y-2";
                feedbackBox.innerHTML = `
                    <div class="text-xl font-bold">🎉 ยินดีด้วย! ทำแบบทดสอบครบแล้ว</div>
                    <p class="text-indigo-200 text-xs sm:text-sm">คุณได้คะแนนรวมทั้งหมด ${activeQuizScore} จาก ${currentLesson.quizzes.length * 10} คะแนน</p>
                `;
            }
        }
    </script>
